name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every day at 06:00 WIB (23:00 UTC), so production is checked even when nothing changes here.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (defaults to production)'
        required: false
      grep:
        description: 'Only run tests matching this tag or title, e.g. @smoke'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
          GREP: ${{ inputs.grep }}
        run: npx playwright test ${GREP:+--grep "$GREP"}

      - name: Restore Allure history from the published report
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json retries-trend.json categories-trend.json; do
            curl -sfL "$REPORT_URL/history/$f" -o "allure-results/history/$f" || true
          done

      - name: Describe the run for Allure
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$REPORT_URL",
            "buildOrder": ${{ github.run_number }}
          }
          EOF

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Allure report for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Summary
        run: |
          echo "### E2E result: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Allure report: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish-report:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  result:
    # Publish the report first, then fail the run if any test failed.
    needs: [test, publish-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.outputs.outcome != 'success'
        run: |
          echo "E2E tests failed, see the Allure report: $REPORT_URL"
          exit 1
