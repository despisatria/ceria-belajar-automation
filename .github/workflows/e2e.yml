name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (empty = production)'
        required: false
      tag:
        description: 'Tag to run'
        type: choice
        default: All
        options:
          - All
          - '@smoke'
          - '@regression'
          - '@mobile'
          - '@profile'
          - '@progress'
      spec:
        description: 'Spec folder or file under tests/ (empty = all), e.g. profile or progress/medals.spec.ts'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  test:
    name: Run E2E Tests (${{ inputs.base_url || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.results.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: test
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
          TAG: ${{ inputs.tag }}
          SPEC: ${{ inputs.spec }}
        run: |
          ARGS=()
          if [ -n "$SPEC" ]; then ARGS+=("tests/$SPEC"); fi
          if [ -n "$TAG" ] && [ "$TAG" != "All" ]; then ARGS+=(--grep "$TAG"); fi
          npx playwright test "${ARGS[@]}"

      - name: Calculate duration
        id: duration
        if: always()
        run: |
          DURATION=$(( $(date +%s) - ${{ steps.start_time.outputs.start }} ))
          echo "duration=$((DURATION / 60))m $((DURATION % 60))s" >> "$GITHUB_OUTPUT"

      - name: Restore Allure history from the published report
        if: always()
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json retries-trend.json categories-trend.json; do
            curl -sfL "$REPORT_URL/history/$f" -o "allure-results/history/$f" || true
          done

      - name: Describe the run for Allure
        if: always()
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$REPORT_URL",
            "buildOrder": ${{ github.run_number }}
          }
          EOF

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Get test results from Allure
        id: results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          SUMMARY="allure-report/widgets/summary.json"
          if [ -f "$SUMMARY" ]; then
            PASSED=$(jq '.statistic.passed' "$SUMMARY")
            FAILED=$(jq '.statistic.failed' "$SUMMARY")
            BROKEN=$(jq '.statistic.broken' "$SUMMARY")
            SKIPPED=$(jq '.statistic.skipped' "$SUMMARY")
            TOTAL=$(jq '.statistic.total' "$SUMMARY")
          else
            PASSED=0; FAILED=0; BROKEN=0; SKIPPED=0; TOTAL=0
          fi
          RUN=$(( TOTAL - SKIPPED ))
          SUCCESS_RATE=$(( RUN > 0 ? PASSED * 100 / RUN : 0 ))
          {
            echo "passed=$PASSED"; echo "failed=$FAILED"; echo "broken=$BROKEN"
            echo "skipped=$SKIPPED"; echo "total=$TOTAL"; echo "success_rate=$SUCCESS_RATE"
          } >> "$GITHUB_OUTPUT"
          if [ "$TEST_OUTCOME" != "success" ] || [ "$FAILED" -gt 0 ] || [ "$BROKEN" -gt 0 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Allure report for Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Test results summary
        if: always()
        env:
          TARGET: ${{ inputs.base_url || 'https://ceria-belajar.pages.dev (production)' }}
          TAG: ${{ inputs.tag || 'All' }}
          SPEC: ${{ inputs.spec || 'All' }}
          PUBLISHED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          {
            echo "## 🧸 Ceria Belajar E2E Test Results"
            echo ""
            echo "**Target:** $TARGET  "
            echo "**Tag:** $TAG  "
            echo "**Spec:** $SPEC  "
            echo "**Trigger:** ${{ github.event_name }} by @${{ github.actor }}"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Passed | ${{ steps.results.outputs.passed }} |"
            echo "| ❌ Failed | ${{ steps.results.outputs.failed }} |"
            echo "| ⚠️ Broken | ${{ steps.results.outputs.broken }} |"
            echo "| ⏭️ Skipped | ${{ steps.results.outputs.skipped }} |"
            echo "| 📊 Total | ${{ steps.results.outputs.total }} |"
            echo "| 🎯 Success Rate | ${{ steps.results.outputs.success_rate }}% |"
            echo "| ⏱️ Duration | ${{ steps.duration.outputs.duration }} |"
            echo ""
            if [ "$PUBLISHED" = "true" ]; then
              echo "📈 [View Allure Report]($REPORT_URL)"
            else
              echo "📈 Allure report is published from \`main\` only. This run's Playwright report is in the **playwright-report** artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-report:
    name: Publish Allure Report
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  result:
    # Publish the report first, then fail the run if any test failed.
    name: Result
    needs: [test, publish-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.outputs.status != 'success'
        run: |
          echo "E2E tests failed, see the Allure report: $REPORT_URL"
          exit 1
